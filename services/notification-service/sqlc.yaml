version: "2"
sql:
  - schema: "migrations"
    queries: "sql/query.sql"
    engine: "postgresql"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: uuid
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
